<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Sincerity Tools</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <div class="head-text">
        <h1>Sincerity Tools</h1>
        <p class="tagline">텍스트 선택 도구 모음</p>
      </div>
    </header>

    <section class="desc">
      페이지 어디서든 텍스트를 선택하면 위에 작은 툴바가 떠올라요.
      base64 인코드 / 디코드, QR 코드 생성, URL 검사기 같은 작은 도구를 한 번의 클릭으로 쓸 수 있어요.
    </section>

    <section class="scans">
      <div class="scan-section-label">페이지 스캔</div>
      <button class="scan-btn" id="run-hidden-text" type="button">
        <span class="scan-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <span class="scan-btn-text">
          <strong>히든 텍스트 찾기</strong>
          <small>배경과 거의 같은 색 · 미세한 크기 · 화면 밖 텍스트</small>
        </span>
      </button>
    </section>

    <section class="hint">
      <strong>팁</strong> · 오른쪽 클릭 → <em>Sincerity Tools</em> 메뉴에서도 같은 도구를 호출할 수 있어요.
    </section>

    <footer class="meta">
      <div class="row">
        <span class="label">버전</span>
        <span class="val" id="version">—</span>
      </div>
      <div class="row">
        <span class="label">빌드</span>
        <span class="val build" id="build">—</span>
      </div>
      <div class="row">
        <span class="label">빌드 시각</span>
        <span class="val" id="time">—</span>
      </div>
      <div class="copy" id="copy">© 2026 Sincerity Tools · MIT</div>
    </footer>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
